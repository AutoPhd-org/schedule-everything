<text x="382" y="498" font-size="11.5" font-weight="500" fill="#5d5873" text-anchor="start" >agree on a plan, save it</text>
<g filter="url(#shadow)"><rect x="646" y="150" width="246" height="396" rx="30" fill="#1d1833"/></g>
<text x="670" y="190" font-size="11.5" font-weight="800" fill="#c9c1ff" text-anchor="start" letter-spacing="1.8">RMD CLI · NO AI INSIDE</text>
<text x="670" y="226" font-size="13.5" font-weight="700" fill="#7cf0c3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >$</text>
<text x="686" y="226" font-size="13.5" font-weight="600" fill="#f2effd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >rmd check --json</text>
<text x="686" y="247" font-size="11.5" font-weight="500" fill="#a9a2cc" text-anchor="start" >validate files, find paths</text>
<text x="670" y="288" font-size="13.5" font-weight="700" fill="#7cf0c3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >$</text>
<text x="686" y="288" font-size="13.5" font-weight="600" fill="#f2effd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >rmd sync --json</text>
<text x="686" y="309" font-size="11.5" font-weight="500" fill="#a9a2cc" text-anchor="start" >today’s slots, tasks, deadlines</text>
<text x="670" y="350" font-size="13.5" font-weight="700" fill="#7cf0c3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >$</text>
<text x="686" y="350" font-size="13.5" font-weight="600" fill="#f2effd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >rmd sync --apply -</text>
<text x="686" y="371" font-size="11.5" font-weight="500" fill="#a9a2cc" text-anchor="start" >save today’s plan</text>
<text x="670" y="412" font-size="13.5" font-weight="700" fill="#7cf0c3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >$</text>
<text x="686" y="412" font-size="13.5" font-weight="600" fill="#f2effd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >rmd switch 3</text>
<text x="686" y="433" font-size="11.5" font-weight="500" fill="#a9a2cc" text-anchor="start" >activate a new version</text>
<text x="670" y="474" font-size="13.5" font-weight="700" fill="#7cf0c3" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >$</text>
<text x="686" y="474" font-size="13.5" font-weight="600" fill="#f2effd" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" >rmd update</text>
<text x="686" y="495" font-size="11.5" font-weight="500" fill="#a9a2cc" text-anchor="start" >reload reminders</text>

<text x="48" y="58" font-size="12" font-weight="800" fill="#6250d6" text-anchor="start" letter-spacing="2.4">HOW IT WORKS</text><text x="48" y="94" font-size="27" font-weight="800" fill="#1c1830" text-anchor="start" letter-spacing="-0.6">Your agent does the thinking. rmd keeps the time.</text>
<text x="48" y="150" font-size="13" font-weight="700" fill="#5d5873" text-anchor="start" >You ask</text>

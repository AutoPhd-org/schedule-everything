<path d="M70 232 l-6 14 l20 -14 z" fill="#ffffff" stroke="#e4def6" stroke-linejoin="round"/><rect x="66" y="226" width="22" height="8" fill="#ffffff"/>
<text x="68" y="195" font-size="14" font-weight="600" fill="#1c1830" text-anchor="start" >“Build my weekly</text>
<text x="68" y="215" font-size="14" font-weight="600" fill="#1c1830" text-anchor="start" >schedule”</text>

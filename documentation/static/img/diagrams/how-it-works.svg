<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="How Schedule Everything works: you ask your AI coding agent, the plugin runs rmd commands, rmd writes local files that drive reminders and the browser workspace" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">

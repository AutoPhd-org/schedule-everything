# The original Python implementation, kept as the reference the Rust port is
# tested against (tests/golden records its output). It is not published:
# the `schedule-management` package on PyPI is built from crates/rmd.
[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[project]
name = "schedule-management"
version = "0.10.0"
description = "A TOML based scheduling tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.6",
    "pytest>=8.4.2",
    "rich>=14.2.0",
    "shtab>=1.8.0",
    "readchar>=4.0.0",
    "pyyaml>=6.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
rmd = "schedule_management.reminder:main"
reminder = "schedule_management.reminder:main"

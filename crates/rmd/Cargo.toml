[package]
name = "rmd"
description = "Schedule Everything: a local-first weekly routine, task list, and focus-block reminder app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rmd"
path = "src/lib.rs"

[[bin]]
name = "rmd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11"
comfy-table = "8.0.1"
crossterm = "0.29.0"
dirs = "7.0.0"
hex = "0.4.3"
indexmap = "2.14.2"
krilla = "0.8.2"
krilla-svg = "0.8.1"
libc = "0.2.191"
mime_guess = "2.0.5"
open = "5.4.5"
rand = "0.10.3"
ratatui = "0.30.2"
regex = "1.13.1"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
toml = { version = "1.2.1", features = ["preserve_order"] }
unicode-width = "0.2.3"
ureq = "3.5.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"

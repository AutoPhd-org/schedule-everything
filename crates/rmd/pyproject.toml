# Packages the Rust `rmd` binary as a Python wheel so `pip install
# schedule-management` (or `uv tool install schedule-management`) puts `rmd`
# on PATH. Build with: maturin build --release -m crates/rmd/Cargo.toml
[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "schedule-management"
description = "Schedule Everything: weekly routine, tasks, and persistent focus-block reminders (the rmd CLI)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dynamic = ["version"]
keywords = ["schedule", "reminders", "pomodoro", "tasks", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/AutoPhd-org/schedule-everything"
Documentation = "https://autophd-org.github.io/schedule-everything/"
Repository = "https://github.com/AutoPhd-org/schedule-everything"

[tool.maturin]
bindings = "bin"
strip = true

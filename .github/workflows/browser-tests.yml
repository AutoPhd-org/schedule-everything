name: Browser Tests
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      # Bun installs packages; Vitest, Vite, and tsc run on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - name: Check bundled assets match frontend source
        run: git diff --exit-code -- src/schedule_management/web/static
      - run: uv run pytest tests/test_browser_server.py tests/test_web_api.py tests/test_web_services.py tests/test_web_sync_helpers.py tests/test_web_insights.py tests/test_conferences.py tests/test_recurrence.py -q
